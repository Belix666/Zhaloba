<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пожаловаться</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Пожаловаться</h1>
        <textarea id="complaintText" rows="4" maxlength="500" placeholder="Напиши, на что жалуешься..." style="width: 100%; box-sizing: border-box; padding: 10px; font-size: 16px; margin-bottom: 10px; resize: vertical;"></textarea>
        <button id="reportBtn" class="report-btn">Отправить жалобу</button>
        <div class="counter">
            Всего пожаловались: <span id="count">0</span>
        </div>
        <div id="message" class="message"></div>
        <div id="complaintsSection" style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee;">
            <h3 style="color: #333; margin-bottom: 15px;">Последние 15 жалоб</h3>
            <div id="complaintsList" style="max-height: 300px; overflow-y: auto; font-size: 14px;">
                <div style="color: #999; text-align: center; padding: 20px;">
                    Загрузка жалоб...
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
